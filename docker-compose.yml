# Smart Campus Access Control
# EC2/Atlas deployment: app services use MongoDB Atlas via MONGO_URI in .env.
# Only the API Gateway is published externally; microservice ports remain host-local.

networks:
  campus_network:
    driver: bridge

# Shared settings keep service definitions concise and consistent.
x-node-service: &node-service
  restart: unless-stopped
  networks:
    - campus_network

x-node-environment: &node-environment
  MONGO_URI: ${MONGO_URI:?Set MONGO_URI in your .env file}
  JWT_SECRET: ${JWT_SECRET:-dev-only-change-this-secret-before-deployment}

x-node-healthcheck: &node-healthcheck
  test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:$${PORT}/health || exit 1"]
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 15s

services:
  registration_service:
    <<: *node-service
    build: ./Registration_Microservice
    container_name: campus_registration_service
    ports:
      - "127.0.0.1:5001:5001"
    environment:
      <<: *node-environment
      PORT: "5001"
      DEMO_MODE: ${DEMO_MODE:-true}
    healthcheck: *node-healthcheck

  auth_service:
    <<: *node-service
    build: ./Authentication_Microservice
    container_name: campus_auth_service
    ports:
      - "127.0.0.1:5002:5002"
    environment:
      <<: *node-environment
      PORT: "5002"
    healthcheck: *node-healthcheck

  room_service:
    <<: *node-service
    build: ./Room_Microservice
    container_name: campus_room_service
    ports:
      - "127.0.0.1:5003:5003"
    environment:
      <<: *node-environment
      PORT: "5003"
    healthcheck: *node-healthcheck

  permission_service:
    <<: *node-service
    build: ./Permission_Microservice
    container_name: campus_permission_service
    ports:
      - "127.0.0.1:5004:5004"
    environment:
      <<: *node-environment
      PORT: "5004"
    healthcheck: *node-healthcheck

  accesslog_service_1:
    <<: *node-service
    build: ./AccessLog_Microservice
    container_name: campus_accesslog_service_1
    ports:
      - "127.0.0.1:5005:5005"
    environment:
      <<: *node-environment
      PORT: "5005"
      INSTANCE_NAME: AccessLog-Instance-1
    healthcheck: *node-healthcheck

  accesslog_service_2:
    <<: *node-service
    build: ./AccessLog_Microservice
    container_name: campus_accesslog_service_2
    ports:
      - "127.0.0.1:5015:5015"
    environment:
      <<: *node-environment
      PORT: "5015"
      INSTANCE_NAME: AccessLog-Instance-2
    healthcheck: *node-healthcheck

  emergency_service:
    <<: *node-service
    build: ./EmergencyAlert_Microservice
    container_name: campus_emergency_service
    ports:
      - "127.0.0.1:5006:5006"
    environment:
      <<: *node-environment
      PORT: "5006"
    healthcheck: *node-healthcheck

  student_service:
    <<: *node-service
    build: ./Student_Microservice
    container_name: campus_student_service
    ports:
      - "127.0.0.1:5007:5007"
    environment:
      <<: *node-environment
      PORT: "5007"
    healthcheck: *node-healthcheck

  teacher_service:
    <<: *node-service
    build: ./Teacher_Microservice
    container_name: campus_teacher_service
    ports:
      - "127.0.0.1:5008:5008"
    environment:
      <<: *node-environment
      PORT: "5008"
    healthcheck: *node-healthcheck

  api_gateway:
    <<: *node-service
    build: ./APIGateway_Microservice
    container_name: campus_api_gateway
    ports:
      # Listen on all EC2 host interfaces. Restrict inbound TCP/4000 in the EC2 security group.
      - "0.0.0.0:4000:4000"
    environment:
      PORT: "4000"
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-this-secret-before-deployment}
      REGISTRATION_SERVICE_URL: http://registration_service:5001
      AUTH_SERVICE_URL: http://auth_service:5002
      ROOM_SERVICE_URL: http://room_service:5003
      PERMISSION_SERVICE_URL: http://permission_service:5004
      ACCESS_LOG_INSTANCE_1: http://accesslog_service_1:5005
      ACCESS_LOG_INSTANCE_2: http://accesslog_service_2:5015
      EMERGENCY_SERVICE_URL: http://emergency_service:5006
      STUDENT_SERVICE_URL: http://student_service:5007
      TEACHER_SERVICE_URL: http://teacher_service:5008
    healthcheck: *node-healthcheck
    depends_on:
      registration_service:
        condition: service_healthy
      auth_service:
        condition: service_healthy
      room_service:
        condition: service_healthy
      permission_service:
        condition: service_healthy
      accesslog_service_1:
        condition: service_healthy
      accesslog_service_2:
        condition: service_healthy
      emergency_service:
        condition: service_healthy
      student_service:
        condition: service_healthy
      teacher_service:
        condition: service_healthy
