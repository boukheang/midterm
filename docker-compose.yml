# Smart Campus Access Control - Docker Compose deployment
# Only the API Gateway is exposed publicly by default.
networks:
  campus_network:
    driver: bridge
volumes:
  mongodb_data:
    driver: local
services:
  mongodb:
    image: mongo:7.0
    container_name: campus_mongodb
    restart: always
    ports:
    - 127.0.0.1:27017:27017
    volumes:
    - mongodb_data:/data/db
    networks:
    - campus_network
    healthcheck:
      test:
      - CMD
      - mongosh
      - --eval
      - db.adminCommand('ping')
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
  api_gateway:
    build:
      context: ./APIGateway_Microservice
      dockerfile: Dockerfile
    container_name: campus_api_gateway
    restart: always
    ports:
    - 4000:4000
    environment:
      PORT: '4000'
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-this-secret-before-deployment}
      REGISTRATION_SERVICE_URL: http://registration_service:5001
      AUTH_SERVICE_URL: http://auth_service:5002
      ROOM_SERVICE_URL: http://room_service:5003
      PERMISSION_SERVICE_URL: http://permission_service:5004
      ACCESS_LOG_INSTANCE_1: http://accesslog_service_1:5005
      ACCESS_LOG_INSTANCE_2: http://accesslog_service_2:5015
      EMERGENCY_SERVICE_URL: http://emergency_service:5006
      STUDENT_SERVICE_URL: http://student_service:5007
      TEACHER_SERVICE_URL: http://teacher_service:5008
    networks:
    - campus_network
    depends_on:
      registration_service:
        condition: service_healthy
      auth_service:
        condition: service_healthy
      room_service:
        condition: service_healthy
      permission_service:
        condition: service_healthy
      accesslog_service_1:
        condition: service_healthy
      accesslog_service_2:
        condition: service_healthy
      emergency_service:
        condition: service_healthy
      student_service:
        condition: service_healthy
      teacher_service:
        condition: service_healthy
  registration_service:
    build:
      context: ./Registration_Microservice
      dockerfile: Dockerfile
    container_name: campus_registration_service
    restart: always
    ports:
    - 127.0.0.1:5001:5001
    environment:
      PORT: '5001'
      MONGO_URI: ${MONGO_URI:-mongodb://mongodb:27017/smart_campus_access_db}
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-this-secret-before-deployment}
    networks:
    - campus_network
    depends_on:
      mongodb:
        condition: service_healthy
  auth_service:
    build:
      context: ./Authentication_Microservice
      dockerfile: Dockerfile
    container_name: campus_auth_service
    restart: always
    ports:
    - 127.0.0.1:5002:5002
    environment:
      PORT: '5002'
      MONGO_URI: ${MONGO_URI:-mongodb://mongodb:27017/smart_campus_access_db}
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-this-secret-before-deployment}
    networks:
    - campus_network
    depends_on:
      mongodb:
        condition: service_healthy
  room_service:
    build:
      context: ./Room_Microservice
      dockerfile: Dockerfile
    container_name: campus_room_service
    restart: always
    ports:
    - 127.0.0.1:5003:5003
    environment:
      PORT: '5003'
      MONGO_URI: ${MONGO_URI:-mongodb://mongodb:27017/smart_campus_access_db}
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-this-secret-before-deployment}
    networks:
    - campus_network
    depends_on:
      mongodb:
        condition: service_healthy
  permission_service:
    build:
      context: ./Permission_Microservice
      dockerfile: Dockerfile
    container_name: campus_permission_service
    restart: always
    ports:
    - 127.0.0.1:5004:5004
    environment:
      PORT: '5004'
      MONGO_URI: ${MONGO_URI:-mongodb://mongodb:27017/smart_campus_access_db}
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-this-secret-before-deployment}
    networks:
    - campus_network
    depends_on:
      mongodb:
        condition: service_healthy
  accesslog_service_1:
    build:
      context: ./AccessLog_Microservice
      dockerfile: Dockerfile
    container_name: campus_accesslog_service_1
    restart: always
    ports:
    - 127.0.0.1:5005:5005
    environment:
      PORT: '5005'
      INSTANCE_NAME: AccessLog-Instance-1
      MONGO_URI: ${MONGO_URI:-mongodb://mongodb:27017/smart_campus_access_db}
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-this-secret-before-deployment}
    networks:
    - campus_network
    depends_on:
      mongodb:
        condition: service_healthy
  accesslog_service_2:
    build:
      context: ./AccessLog_Microservice
      dockerfile: Dockerfile
    container_name: campus_accesslog_service_2
    restart: always
    ports:
    - 127.0.0.1:5015:5015
    environment:
      PORT: '5015'
      INSTANCE_NAME: AccessLog-Instance-2
      MONGO_URI: ${MONGO_URI:-mongodb://mongodb:27017/smart_campus_access_db}
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-this-secret-before-deployment}
    networks:
    - campus_network
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - wget
      - --spider
      - -q
      - http://127.0.0.1:5015/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
  emergency_service:
    build:
      context: ./EmergencyAlert_Microservice
      dockerfile: Dockerfile
    container_name: campus_emergency_service
    restart: always
    ports:
    - 127.0.0.1:5006:5006
    environment:
      PORT: '5006'
      MONGO_URI: ${MONGO_URI:-mongodb://mongodb:27017/smart_campus_access_db}
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-this-secret-before-deployment}
    networks:
    - campus_network
    depends_on:
      mongodb:
        condition: service_healthy
  student_service:
    build:
      context: ./Student_Microservice
      dockerfile: Dockerfile
    container_name: campus_student_service
    restart: always
    ports:
    - 127.0.0.1:5007:5007
    environment:
      PORT: '5007'
      MONGO_URI: ${MONGO_URI:-mongodb://mongodb:27017/smart_campus_access_db}
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-this-secret-before-deployment}
    healthcheck:
      test:
      - CMD
      - wget
      - --spider
      - -q
      - http://127.0.0.1:5007/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
    - campus_network
    depends_on:
      mongodb:
        condition: service_healthy
  teacher_service:
    build:
      context: ./Teacher_Microservice
      dockerfile: Dockerfile
    container_name: campus_teacher_service
    restart: always
    ports:
    - 127.0.0.1:5008:5008
    environment:
      PORT: '5008'
      MONGO_URI: ${MONGO_URI:-mongodb://mongodb:27017/smart_campus_access_db}
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-this-secret-before-deployment}
    healthcheck:
      test:
      - CMD
      - wget
      - --spider
      - -q
      - http://127.0.0.1:5008/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
    - campus_network
    depends_on:
      mongodb:
        condition: service_healthy
