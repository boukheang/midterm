apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: campus-gateway
  namespace: smart-campus
  annotations:
    external-dns.alpha.kubernetes.io/hostname: aupp.com
spec:
  ingressClassName: nginx
  rules:
    - host: aupp.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 4000
