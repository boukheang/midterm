# Internal ClusterIP Services - only reachable inside the cluster.
apiVersion: v1
kind: Service
metadata:
  name: registration-service
  namespace: smart-campus
  labels:
    app: registration-service
    app.kubernetes.io/part-of: smart-campus
spec:
  selector:
    app: registration-service
  ports:
    - name: http
      port: 5001
      targetPort: http
