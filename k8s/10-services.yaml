# Headless Service: DNS returns one A record per *ready* Access Log pod.
# The API Gateway uses it for its round-robin load balancer.
apiVersion: v1
kind: Service
metadata:
  name: access-log-headless
  namespace: smart-campus
  labels:
    app: access-log-service
    app.kubernetes.io/part-of: smart-campus
spec:
  clusterIP: None
  selector:
    app: access-log-service
  ports:
    - name: http
      port: 5005
      targetPort: http
