# EXAMPLE ONLY - do not commit real values.
# The deploy script (scripts/deploy.ps1) creates the real Secret for you with a
# random JWT secret. To create it by hand instead:
#
#   kubectl -n smart-campus create secret generic campus-secrets `
#     --from-literal=MONGO_URI="mongodb://mongodb:27017/smart_campus_access_db" `
#     --from-literal=JWT_SECRET="<at least 32 random characters>" `
#     --from-literal=ADMIN_EMAIL="admin@campus.edu" `
#     --from-literal=ADMIN_PASSWORD="<admin password>"
apiVersion: v1
kind: Secret
metadata:
  name: campus-secrets
  namespace: smart-campus
type: Opaque
stringData:
  # Default: the MongoDB running inside the cluster (k8s/04-mongodb.yaml).
  # To use MongoDB Atlas instead, put your (rotated!) Atlas connection string here.
  MONGO_URI: mongodb://mongodb:27017/smart_campus_access_db
  JWT_SECRET: replace-with-at-least-32-random-characters
  # First admin account, created by the Registration service on startup.
  # Public sign-up can only create student/faculty accounts.
  ADMIN_EMAIL: admin@campus.edu
  ADMIN_PASSWORD: replace-with-admin-password
