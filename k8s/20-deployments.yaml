# Backend microservices. Generated from one template so every service has the
# same probes, resource limits and security settings.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registration-service
  namespace: smart-campus
  labels:
    app: registration-service
    app.kubernetes.io/part-of: smart-campus
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: registration-service
  template:
    metadata:
      labels:
        app: registration-service
        app.kubernetes.io/part-of: smart-campus
        campus-tier: backend   # used by k8s/30-network-policy.yaml
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: registration
          image: sokhadum/smart-campus-registration:build-20261118-170528
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5001
          envFrom:
            - configMapRef:
                name: campus-service-config
          env:
            - name: PORT
              value: "5001"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: campus-secrets
                  key: MONGO_URI
            - name: ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: campus-secrets
                  key: ADMIN_EMAIL
                  optional: true
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: campus-secrets
                  key: ADMIN_PASSWORD
                  optional: true
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
          # /health checks MongoDB too: the pod only receives traffic once the DB is reachable.
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          # /livez only checks the process, so a DB outage does not cause restart loops.
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
---
