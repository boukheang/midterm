# Ingress: the public entry point of the cluster.
#   browser --HTTP--> ingress-nginx controller --> api-gateway Service (ClusterIP) --> services
# The NGINX Ingress Controller is installed by scripts/deploy.ps1.
#
# Two ways to reach it:
#   http://localhost              (rule without a host - works with no extra setup)
#   http://smartcampus.local      (named host - add this line to
#                                  C:\Windows\System32\drivers\etc\hosts as Administrator:
#                                  127.0.0.1 smartcampus.local)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: campus-gateway
  namespace: smart-campus
  labels:
    app.kubernetes.io/part-of: smart-campus
  annotations:
    # The dashboard and API are plain HTTP for the local demo.
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
spec:
  ingressClassName: nginx
  rules:
    - host: smartcampus.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 4000
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 4000
