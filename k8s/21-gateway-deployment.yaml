apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: smart-campus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: gateway
          image: smart-campus/api-gateway:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4000
          env:
            - name: PORT
              value: "4000"
            - name: LOG_FILE
              value: /var/log/campus/gateway.log
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: campus-secrets
                  key: JWT_SECRET
          envFrom:
            - configMapRef:
                name: campus-service-config
          volumeMounts:
            - name: campus-logs
              mountPath: /var/log/campus
          readinessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 20
            periodSeconds: 20
        - name: log-reader
          image: busybox:1.36
          command:
            - sh
            - -c
            - touch /var/log/campus/gateway.log && tail -n 20 -F /var/log/campus/gateway.log
          volumeMounts:
            - name: campus-logs
              mountPath: /var/log/campus
      volumes:
        - name: campus-logs
          persistentVolumeClaim:
            claimName: campus-shared-logs
