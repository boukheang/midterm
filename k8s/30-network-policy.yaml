# Network isolation inside the cluster ("zero trust" between pods).
#   outside world -> API Gateway        (allowed, port 4000)
#   API Gateway   -> backend services   (allowed)
#   backend       -> MongoDB            (allowed, port 27017)
#   everything else                     (blocked)
# So even a pod inside the cluster cannot call a service directly with forged
# X-User-* headers; only the gateway, which verifies the JWT, can reach them.
# Enforced by the cluster's network plugin (kindnet on Docker Desktop, Calico/Cilium, ...).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: smart-campus
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-from-anywhere
  namespace: smart-campus
spec:
  podSelector:
    matchLabels:
      campus-tier: gateway
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 4000
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-backend-from-gateway
  namespace: smart-campus
spec:
  podSelector:
    matchLabels:
      campus-tier: backend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              campus-tier: gateway
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-mongodb-from-backend
  namespace: smart-campus
spec:
  podSelector:
    matchLabels:
      campus-tier: database
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              campus-tier: backend
      ports:
        - port: 27017
          protocol: TCP
