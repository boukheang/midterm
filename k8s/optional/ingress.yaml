# OPTIONAL - only if an NGINX Ingress Controller is installed
# (minikube: `minikube addons enable ingress`). Not needed on Docker Desktop,
# where the api-gateway LoadBalancer Service already serves http://localhost:4000.
#
# Add this line to C:\Windows\System32\drivers\etc\hosts (as Administrator):
#   127.0.0.1 smartcampus.local
# then open http://smartcampus.local
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: campus-gateway
  namespace: smart-campus
spec:
  ingressClassName: nginx
  rules:
    - host: smartcampus.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 4000
