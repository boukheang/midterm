# API Gateway: application entry point (JWT, roles, routing, load balancing).
# Its Service is internal (ClusterIP). Outside traffic arrives through the
# Ingress (k8s/40-ingress.yaml), so the Ingress is the cluster's only public door.
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: smart-campus
  labels:
    app: api-gateway
    app.kubernetes.io/part-of: smart-campus
spec:
  type: ClusterIP
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 4000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: smart-campus
  labels:
    app: api-gateway
    app.kubernetes.io/part-of: smart-campus
spec:
  replicas: 1
  revisionHistoryLimit: 3
  # The shared log volume is ReadWriteOnce, so replace the pod instead of
  # running old and new side by side during an update.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
        app.kubernetes.io/part-of: smart-campus
        campus-tier: gateway   # used by k8s/30-network-policy.yaml
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: gateway
          image: sokhadum/smart-campus-api-gateway:build-20261118-211138
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4000
          envFrom:
            - configMapRef:
                name: campus-service-config
          env:
            - name: PORT
              value: "4000"
            - name: LOG_FILE
              value: /var/log/campus/gateway.log
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: campus-secrets
                  key: JWT_SECRET
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: campus-logs
              mountPath: /var/log/campus
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
        # Sidecar: streams the gateway's request log from the shared volume.
        #   kubectl -n smart-campus logs deploy/api-gateway -c log-reader -f
        - name: log-reader
          image: busybox:1.36
          command: ["sh", "-c", "touch /var/log/campus/gateway.log && tail -n 20 -F /var/log/campus/gateway.log"]
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 50m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: campus-logs
              mountPath: /var/log/campus
      volumes:
        - name: campus-logs
          persistentVolumeClaim:
            claimName: campus-shared-logs
