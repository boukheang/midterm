apiVersion: v1
kind: Secret
metadata:
  name: campus-secrets
  namespace: smart-campus
type: Opaque
stringData:
  # Replace both values before applying this file. Keep this file private.
  MONGO_URI: mongodb+srv://REPLACE_USER:REPLACE_PASSWORD@REPLACE_CLUSTER.mongodb.net/UserData?retryWrites=true&w=majority
  JWT_SECRET: REPLACE_WITH_A_LONG_RANDOM_SECRET
